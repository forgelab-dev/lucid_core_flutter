name: lucid_core_flutter
description: "Core des projets Flutter de LucidForge - Fournit des utilitaires, widgets et services communs pour tous les projets LucidForge."
version: 0.0.1

# Liens du projet
homepage: https://github.com/MikeCHOKKI/lucid_core
repository: https://github.com/MikeCHOKKI/lucid_core
issue_tracker: https://github.com/MikeCHOKKI/lucid_core/issues
documentation: https://github.com/MikeCHOKKI/lucid_core/wiki

# Mots-clés pour la découverte
topics:
  - flutter
  - dart
  - utilities
  - core
  - lucidforge

# Environnement requis
environment:
  sdk: ^3.8.1
  flutter: ">=3.3.0"

dependencies:
  # ===== SDK Flutter =====
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ===== Internationalisation =====
  intl: ^0.20.2

  # ===== Web Support =====
  web: ^1.0.0
  plugin_platform_interface: ^2.0.2

  # ===== Authentification & Backend =====
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.1
  supabase_flutter: ^2.9.1

  # ===== Stockage & Persistance =====
  shared_preferences: ^2.3.5
  flutter_secure_storage: ^9.2.4

  # ===== Sécurité & Authentification =====
  local_auth: ^2.3.0
  crypto: ^3.0.6

  # ===== Réseau & Connectivité =====
  connectivity_plus: ^6.1.0
  dio: ^5.7.0

  # ===== Informations Système =====
  package_info_plus: ^8.3.1
  device_info_plus: ^11.5.0
  permission_handler: ^12.0.1

  # ===== Navigation & Partage =====
  url_launcher: ^6.3.2
  share_plus: ^11.1.0

  # ===== Notifications & Haptiques =====
  flutter_local_notifications: ^19.2.1
  vibration: ^3.1.3
  path_provider: ^2.1.5

dev_dependencies:
  # ===== Tests =====
  flutter_test:
    sdk: flutter

  # ===== Analyse & Linting =====
  flutter_lints: ^6.0.0

# Configuration du plugin
flutter:
  generate: true

  plugin:
    platforms:
      android:
        package: com.lucidforge.lucid_core_flutter
        pluginClass: LucidCoreFlutterPlugin
      ios:
        pluginClass: LucidCoreFlutterPlugin
      linux:
        pluginClass: LucidCoreFlutterPlugin
      macos:
        pluginClass: LucidCoreFlutterPlugin
      windows:
        pluginClass: LucidCoreFlutterPluginCApi
      web:
        pluginClass: LucidCoreFlutterWeb
        fileName: lucid_core_flutter_web.dart
