name: lucid_core_flutter
description: "Core des projets Flutter de LucidForge - Fournit des utilitaires, widgets et services communs pour tous les projets LucidForge."
version: 0.0.1

# Package propriétaire : jamais publié sur pub.dev, consommé via Git
publish_to: none

# Liens du projet
repository: https://github.com/forgelab-dev/lucid_core_flutter
issue_tracker: https://github.com/forgelab-dev/lucid_core_flutter/issues

# Environnement requis
environment:
  sdk: ^3.8.1
  flutter: ">=3.3.0"

dependencies:
  # ===== SDK Flutter =====
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ===== Internationalisation =====
  intl: ^0.20.2

  # ===== Web Support =====
  web: ^1.0.0
  plugin_platform_interface: ^2.0.2

  # ===== Authentification & Backend =====
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.1
  supabase_flutter: ^2.9.1

  # ===== Stockage & Persistance =====
  shared_preferences: ^2.3.5
  flutter_secure_storage: ^11.1.1

  # ===== Sécurité & Authentification =====
  local_auth: ^3.0.2
  crypto: ^3.0.6
  encrypt: ^5.0.3

  # ===== Compression =====
  archive: ^4.2.0

  # ===== Réseau & Connectivité =====
  connectivity_plus: ^7.3.1
  dio: ^5.7.0

  # ===== Informations Système =====
  package_info_plus: ^10.2.1
  device_info_plus: ^13.2.0
  permission_handler: ^13.0.2

  # ===== Navigation & Partage =====
  url_launcher: ^6.3.2
  share_plus: ^13.3.0

  # ===== Notifications & Haptiques =====
  flutter_local_notifications: ^22.3.1
  vibration: ^3.1.3
  path_provider: ^2.1.5

dev_dependencies:
  # ===== Tests =====
  flutter_test:
    sdk: flutter

  # ===== Analyse & Linting =====
  flutter_lints: ^6.0.0

# Configuration du plugin
flutter:
  generate: true

  plugin:
    platforms:
      android:
        package: com.lucidforge.lucid_core_flutter
        pluginClass: LucidCoreFlutterPlugin
      ios:
        pluginClass: LucidCoreFlutterPlugin
      linux:
        pluginClass: LucidCoreFlutterPlugin
      macos:
        pluginClass: LucidCoreFlutterPlugin
      windows:
        pluginClass: LucidCoreFlutterPluginCApi
      web:
        pluginClass: LucidCoreFlutterWeb
        fileName: lucid_core_flutter_web.dart
